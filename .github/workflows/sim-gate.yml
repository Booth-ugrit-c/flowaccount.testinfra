name: sim-gate

run-name: sim-gate ${{ inputs.base }} to ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base for the affected selection, a branch or a commit on a branch of this repository
        required: false
        default: origin/main
        type: string
      head:
        description: Branch of this repository or a full commit SHA on one, both built and used for the affected selection
        required: false
        default: main
        type: string
      fail_test:
        description: Lab fault, add one failing test to the first test project of each lane
        required: false
        default: false
        type: boolean
      simulate_kill:
        description: Lab fault, kill the runner mid test (none, onprem attempt only, or attempt and retry)
        required: false
        default: none
        type: choice
        options:
          - none
          - onprem
          - both

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      default_tip: ${{ steps.resolve.outputs.default_tip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve refs
        id: resolve
        env:
          BASE_REF: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh core/resolve_refs.sh

  unit:
    name: unit
    needs: validate
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/sim-gate-lane.yml # zizmor: ignore[self-repository]
    with:
      lane: unit
      base: ${{ needs.validate.outputs.base_sha }}
      head: ${{ needs.validate.outputs.head_sha }}
      default_tip: ${{ needs.validate.outputs.default_tip == 'true' }}
      fail_test: ${{ inputs.fail_test }}
      simulate_kill: ${{ inputs.simulate_kill }}
      lab_label: ${{ vars.SIM_LAB_LABEL_UNIT }}

  integration:
    name: integration
    needs: validate
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/sim-gate-lane.yml # zizmor: ignore[self-repository]
    with:
      lane: integration
      base: ${{ needs.validate.outputs.base_sha }}
      head: ${{ needs.validate.outputs.head_sha }}
      default_tip: ${{ needs.validate.outputs.default_tip == 'true' }}
      fail_test: ${{ inputs.fail_test }}
      simulate_kill: ${{ inputs.simulate_kill }}
      lab_label: ${{ vars.SIM_LAB_LABEL_INTEGRATION }}

  gate:
    name: gate
    needs:
      - unit
      - integration
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Decide
        env:
          UNIT_ATTEMPT: ${{ needs.unit.outputs.attempt_verdict }}
          UNIT_RETRY: ${{ needs.unit.outputs.retry_verdict }}
          INTEGRATION_ATTEMPT: ${{ needs.integration.outputs.attempt_verdict }}
          INTEGRATION_RETRY: ${{ needs.integration.outputs.retry_verdict }}
          UNIT_ATTEMPT_REASON: ${{ needs.unit.outputs.attempt_reason }}
          UNIT_RETRY_REASON: ${{ needs.unit.outputs.retry_reason }}
          INTEGRATION_ATTEMPT_REASON: ${{ needs.integration.outputs.attempt_reason }}
          INTEGRATION_RETRY_REASON: ${{ needs.integration.outputs.retry_reason }}
        run: |
          python3 -m core.gate \
            --lane "unit=${UNIT_ATTEMPT},${UNIT_RETRY}" \
            --lane "integration=${INTEGRATION_ATTEMPT},${INTEGRATION_RETRY}" \
            --reason "unit=${UNIT_RETRY_REASON:-$UNIT_ATTEMPT_REASON}" \
            --reason "integration=${INTEGRATION_RETRY_REASON:-$INTEGRATION_ATTEMPT_REASON}"
