name: sim-gate

run-name: ${{ format('sim-gate {0} {1} from {2}{3}{4}', inputs.stack, inputs.pr_branch, inputs.base, inputs.lanes != '' && format(' lanes {0}', inputs.lanes) || '', inputs.retest_of != '' && format(' retest of {0} (Retest)', inputs.retest_of) || '') }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number, digits or empty
        required: false
        default: ""
        type: string
      pr_branch:
        description: Branch of this repository that holds the change
        required: false
        default: main
        type: string
      pr_sha:
        description: Full commit SHA on pr_branch; empty means the branch tip
        required: false
        default: ""
        type: string
      pr_author:
        description: Login of the pull request author, or empty
        required: false
        default: ""
        type: string
      base:
        description: Base for the affected selection, a branch or a commit on a branch of this repository
        required: false
        default: origin/main
        type: string
      stack:
        description: Which adapter runs
        required: false
        default: dotnet
        type: choice
        options:
          - dotnet
      lanes:
        description: Comma-separated lanes to run; empty runs every lane
        required: false
        default: ""
        type: string
      cache:
        description: Use the build cache or build everything
        required: false
        default: "use"
        type: choice
        options:
          - "use"
          - "off"
      fault:
        description: Lab fault to inject
        required: false
        default: none
        type: choice
        options:
          - none
          - fail_test
          - kill_onprem
          - kill_both
          - fail_health_once
          - fail_health_twice
      retest_of:
        description: Run id this run retests, or empty
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr_sha: ${{ steps.resolve.outputs.pr_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      default_tip: ${{ steps.resolve.outputs.default_tip }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_branch: ${{ steps.resolve.outputs.pr_branch }}
      pr_author: ${{ steps.resolve.outputs.pr_author }}
      retest_of: ${{ steps.resolve.outputs.retest_of }}
      lane_unit: ${{ steps.resolve.outputs.lane_unit }}
      lane_integration: ${{ steps.resolve.outputs.lane_integration }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve refs
        id: resolve
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_SHA: ${{ inputs.pr_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          BASE_REF: ${{ inputs.base }}
          RETEST_OF: ${{ inputs.retest_of }}
          LANES: ${{ inputs.lanes }}
          KNOWN_LANES: unit integration
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: sh core/resolve_refs.sh

  build:
    name: build
    needs: validate
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    uses: ./.github/workflows/tpl-dotnet-build.yml # zizmor: ignore[self-repository]
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_branch: ${{ needs.validate.outputs.pr_branch }}
      pr_author: ${{ needs.validate.outputs.pr_author }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      default_tip: ${{ needs.validate.outputs.default_tip == 'true' }}
      runner_label: ${{ vars.SIM_LAB_LABEL_BUILD }}
      cache: ${{ inputs.cache }}
      retest: ${{ needs.validate.outputs.retest_of != '' || github.run_attempt != '1' }}
      sim_fault: ${{ inputs.fault != 'none' && inputs.fault || '' }}

  unit:
    name: unit
    needs:
      - validate
      - build
    if: ${{ needs.validate.outputs.lane_unit == 'true' && needs.build.outputs.verdict == 'pass' }}
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/tpl-dotnet-lane.yml # zizmor: ignore[self-repository]
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_branch: ${{ needs.validate.outputs.pr_branch }}
      pr_author: ${{ needs.validate.outputs.pr_author }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      default_tip: ${{ needs.validate.outputs.default_tip == 'true' }}
      runner_label: ${{ vars.SIM_LAB_LABEL_UNIT }}
      cache: ${{ inputs.cache }}
      retest: ${{ needs.validate.outputs.retest_of != '' || github.run_attempt != '1' }}
      sim_fault: ${{ inputs.fault != 'none' && inputs.fault || '' }}
      lane: unit
      artifact: ${{ needs.build.outputs.artifact }}
      parallel: 0

  integration:
    name: integration
    needs:
      - validate
      - build
    if: ${{ needs.validate.outputs.lane_integration == 'true' && needs.build.outputs.verdict == 'pass' }}
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/tpl-dotnet-lane.yml # zizmor: ignore[self-repository]
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_branch: ${{ needs.validate.outputs.pr_branch }}
      pr_author: ${{ needs.validate.outputs.pr_author }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      base_sha: ${{ needs.validate.outputs.base_sha }}
      default_tip: ${{ needs.validate.outputs.default_tip == 'true' }}
      runner_label: ${{ vars.SIM_LAB_LABEL_INTEGRATION }}
      cache: ${{ inputs.cache }}
      retest: ${{ needs.validate.outputs.retest_of != '' || github.run_attempt != '1' }}
      sim_fault: ${{ inputs.fault != 'none' && inputs.fault || '' }}
      lane: integration
      artifact: ${{ needs.build.outputs.artifact }}
      parallel: 1

  gate:
    name: gate
    needs:
      - validate
      - build
      - unit
      - integration
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      retest_lanes: ${{ steps.decide.outputs.retest_lanes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Decide
        id: decide
        env:
          STACK: ${{ inputs.stack }}
          CACHE: ${{ inputs.cache }}
          FAULT: ${{ inputs.fault }}
          RETEST: ${{ needs.validate.outputs.retest_of != '' || github.run_attempt != '1' }}
          RETEST_OF: ${{ needs.validate.outputs.retest_of }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          PR_BRANCH: ${{ needs.validate.outputs.pr_branch }}
          PR_SHA: ${{ needs.validate.outputs.pr_sha }}
          PR_AUTHOR: ${{ needs.validate.outputs.pr_author }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          BUILD_VERDICT: ${{ needs.build.outputs.verdict }}
          BUILD_REASON: ${{ needs.build.outputs.reason }}
          UNIT_SELECTED: ${{ needs.validate.outputs.lane_unit }}
          UNIT_VERDICT: ${{ needs.unit.outputs.verdict }}
          UNIT_REASON: ${{ needs.unit.outputs.reason }}
          UNIT_EXECUTED: ${{ needs.unit.outputs.executed }}
          INTEGRATION_SELECTED: ${{ needs.validate.outputs.lane_integration }}
          INTEGRATION_VERDICT: ${{ needs.integration.outputs.verdict }}
          INTEGRATION_REASON: ${{ needs.integration.outputs.reason }}
          INTEGRATION_EXECUTED: ${{ needs.integration.outputs.executed }}
        run: |
          set -eu
          set -- --lane "build=${BUILD_VERDICT}" --reason "build=${BUILD_REASON}"
          case "$UNIT_SELECTED" in
              true) set -- "$@" --lane "unit=${UNIT_VERDICT}" --reason "unit=${UNIT_REASON}" --executed "unit=${UNIT_EXECUTED}" ;;
              false) echo "lane unit: not selected" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "gate: red [test]: validate did not select lanes"; exit 1 ;;
          esac
          case "$INTEGRATION_SELECTED" in
              true) set -- "$@" --lane "integration=${INTEGRATION_VERDICT}" --reason "integration=${INTEGRATION_REASON}" --executed "integration=${INTEGRATION_EXECUTED}" ;;
              false) echo "lane integration: not selected" >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "gate: red [test]: validate did not select lanes"; exit 1 ;;
          esac
          case "$RETEST" in
              true) set -- "$@" --retest ;;
              false) ;;
              *) echo "gate: red [test]: the retest flag is neither true nor false"; exit 1 ;;
          esac
          python3 -m core.gate "$@" --stack "$STACK" --retest-of "$RETEST_OF" \
              --input "pr_number=${PR_NUMBER}" --input "pr_branch=${PR_BRANCH}" --input "pr_sha=${PR_SHA}" --input "pr_author=${PR_AUTHOR}" \
              --input "base_sha=${BASE_SHA}" --input "cache=${CACHE}" --input "fault=${FAULT}" --verdict-file "$RUNNER_TEMP/verdict/verdict.json"
      - name: Upload verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-gate-verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          if-no-files-found: ignore
          retention-days: 1

  comment:
    name: comment
    needs:
      - validate
      - gate
    if: ${{ always() && needs.validate.outputs.pr_number != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download verdict
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sim-gate-verdict
          path: ${{ runner.temp }}/verdict
      - name: Upsert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          STACK: ${{ inputs.stack }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}/attempts/{3}', github.server_url, github.repository, github.run_id, github.run_attempt) }}
        run: python3 -m core.comment upsert --pr "$PR_NUMBER" --marker "sim-gate:${STACK}" --state "$RUNNER_TEMP/verdict/verdict.json" --run-url "$RUN_URL"

  requeue:
    name: requeue
    needs:
      - validate
      - gate
    if: ${{ always() && needs.validate.outputs.retest_of == '' && github.run_attempt == '1' && needs.gate.outputs.retest_lanes != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the retest stand-in
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$GITHUB_REF" = "refs/heads/${GITHUB_REF_NAME}" ]
          gh workflow run sim-retest.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f run_id="$GITHUB_RUN_ID"
