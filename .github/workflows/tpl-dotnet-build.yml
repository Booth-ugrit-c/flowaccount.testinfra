name: tpl-dotnet-build

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number, digits or empty
        required: false
        default: ""
        type: string
      pr_branch:
        description: Branch that holds the change
        required: true
        type: string
      pr_author:
        description: Login of the pull request author, or empty
        required: false
        default: ""
        type: string
      pr_sha:
        description: Commit to build, a full SHA resolved by the caller
        required: true
        type: string
      base_sha:
        description: Base commit for the affected selection, a full SHA resolved by the caller
        required: true
        type: string
      default_tip:
        description: True only when the caller resolved pr_sha to the default branch tip on a dispatch from the default branch
        required: false
        default: false
        type: boolean
      lanes:
        description: Comma-separated lanes the caller runs; empty means every lane
        required: false
        default: ""
        type: string
      runner_label:
        description: Opaque runner label; it is printed unmasked in public logs, so never a host name
        required: false
        default: ""
        type: string
      cache:
        description: use or off
        required: false
        default: "use"
        type: string
      retest:
        description: True when this run retests an earlier one
        required: false
        default: false
        type: boolean
      sim_fault:
        description: Lab fault to inject, empty outside the lab
        required: false
        default: ""
        type: string
      solution_root:
        description: Directory that holds global.json and the projects
        required: false
        default: sim/dotnet
        type: string
    outputs:
      verdict:
        description: pass, test or infra
        value: ${{ jobs.classify.outputs.verdict }}
      reason:
        description: Named cause of an infra verdict, otherwise empty
        value: ${{ jobs.classify.outputs.reason }}
      artifact:
        description: Name of the build artifact of this run attempt
        value: ${{ jobs.run.outputs.artifact }}

permissions:
  contents: read

jobs:
  route:
    name: route
    uses: ./.github/workflows/tpl-route.yml # zizmor: ignore[self-repository]
    with:
      runner_label: ${{ inputs.runner_label }}

  run:
    name: run dotnet-build
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.route.outputs.target == 'onprem' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 25
    environment: ${{ needs.route.outputs.target == 'onprem' && inputs.runner_label != '' && 'sim-cache-lab' || inputs.default_tip && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.sim_fault == '' && 'sim-cache-write' || 'sim-cache-read' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIM_ROOT: ${{ inputs.solution_root }}
    outputs:
      artifact: dotnet-build-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Checkout trusted
        if: ${{ runner.environment == 'self-hosted' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .sim-trusted
          persist-credentials: false
          sparse-checkout: core
      - name: Hygiene
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          SIM_SURVIVORS: dotnet testhost vstest.console VBCSCompiler
        run: |
          set -u
          status=0
          if [ -L .sim-trusted ] || [ ! -d .sim-trusted/.git ] || [ "$(git -C .sim-trusted rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "::error::the trusted checkout is not the dispatch commit"
              status=1
          else
              sh .sim-trusted/core/prejob.sh || status=$?
          fi
          rm -rf .sim-trusted
          exit "$status"
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ inputs.solution_root }}/global.json
      - name: Health
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/markers"
          echo "MARKERS=$RUNNER_TEMP/markers" >> "$GITHUB_ENV"
          python3 --version
          (cd "$SIM_ROOT" && dotnet --version)
          touch "$RUNNER_TEMP/markers/health"
      - name: Affected
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.pr_sha }}
        run: python3 -m adapters.dotnet.affected --base "$BASE_SHA" --head "$HEAD_SHA" --root "$SIM_ROOT" > "$RUNNER_TEMP/affected.json"
      - name: Plan
        env:
          FULL: ${{ inputs.default_tip && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.sim_fault == '' && runner.environment == 'github-hosted' && '1' || '0' }}
        run: |
          set -eu
          if [ "$FULL" = 1 ]; then
              set -- --all
          else
              set -- --affected "$RUNNER_TEMP/affected.json"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          python3 -m adapters.dotnet.plan "$@" --root "$SIM_ROOT" --lane all --emit build > "$RUNNER_TEMP/build.txt"
          python3 -m adapters.dotnet.plan "$@" --root "$SIM_ROOT" --lane unit --emit test > "$RUNNER_TEMP/out/unit.txt"
          python3 -m adapters.dotnet.plan "$@" --root "$SIM_ROOT" --lane integration --emit test > "$RUNNER_TEMP/out/integration.txt"
      - name: Join the tailnet
        id: join
        if: ${{ runner.environment == 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.SIM_TAILNET_CLIENT_ID }}
          audience: ${{ secrets.SIM_TAILNET_AUDIENCE }}
          tags: tag:ci-sim
          args: --accept-routes=false
          use-cache: "false"
      - name: Cache tripwire
        env:
          SIM_TAILNET_JOIN: ${{ steps.join.outcome }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_READ_KEY_ID: ${{ secrets.SIM_CACHE_READ_KEY_ID }}
          SIM_CACHE_READ_SECRET: ${{ secrets.SIM_CACHE_READ_SECRET }}
        run: sh adapters/dotnet/cache_build.sh tripwire "$MARKERS"
      - name: Restore cache
        env:
          FAIL_TEST: ${{ inputs.sim_fault == 'fail_test' && '1' || '0' }}
          SIM_CACHE_MODE: ${{ inputs.cache }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_READ_KEY_ID: ${{ secrets.SIM_CACHE_READ_KEY_ID }}
          SIM_CACHE_READ_SECRET: ${{ secrets.SIM_CACHE_READ_SECRET }}
        run: |
          set -eu
          if [ "$FAIL_TEST" = 1 ]; then
              SIM_CACHE_MODE=off
              export SIM_CACHE_MODE
          fi
          sh adapters/dotnet/cache_build.sh restore "$RUNNER_TEMP/build.txt" "$RUNNER_TEMP/hits.txt"
      - name: Build
        env:
          FAIL_TEST: ${{ inputs.sim_fault == 'fail_test' && '1' || '0' }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          MSBUILDDISABLENODEREUSE: "1"
          DOTNET_CLI_USE_MSBUILD_SERVER: "0"
        run: |
          set -eu
          if [ "$FAIL_TEST" = 1 ]; then
              project=$(head -n 1 "$RUNNER_TEMP/out/unit.txt")
              if [ -n "$project" ]; then
                  printf '%s\n' 'using Xunit;' 'public class ForcedFailure' '{' '    [Fact]' \
                      '    public void Asserts_the_wrong_value() => Assert.Equal(2, 1);' '}' > "$(dirname "$GITHUB_WORKSPACE/$project")/ForcedFailure.cs"
              fi
          fi
          sh adapters/dotnet/cache_build.sh build "$RUNNER_TEMP/build.txt" "$RUNNER_TEMP/hits.txt" "$RUNNER_TEMP/built.txt"
      - name: Pack
        run: sh adapters/dotnet/build_artifact.sh pack "$RUNNER_TEMP/out/build.tar"
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 1
      - name: Save cache
        if: ${{ inputs.default_tip && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.sim_fault == '' && runner.environment == 'github-hosted' }}
        env:
          SIM_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SIM_CACHE_MODE: ${{ inputs.cache }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_WRITE_KEY_ID: ${{ secrets.SIM_CACHE_WRITE_KEY_ID }}
          SIM_CACHE_WRITE_SECRET: ${{ secrets.SIM_CACHE_WRITE_SECRET }}
        run: sh adapters/dotnet/cache_build.sh save "$RUNNER_TEMP/built.txt"
      - name: Built
        run: touch "$MARKERS/build"
      - name: Upload markers
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markers-dotnet-build
          path: ${{ runner.temp }}/markers
          if-no-files-found: ignore
          retention-days: 1

  classify:
    name: classify dotnet-build
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Classify
        id: verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          set -eu
          verdict=$(python3 -m core.classify --job-dir "$RUNNER_TEMP/job" --fetch-job "run dotnet-build" --fetch-artifact markers-dotnet-build --run-result "$RUN_RESULT" --reason-file "$RUNNER_TEMP/reason.txt" --infra-step "Set up .NET" --infra-step "Upload build" --done-marker build)
          case "$verdict" in
              pass | test | infra) ;;
              *) verdict="test" ;;
          esac
          reason=
          [ ! -f "$RUNNER_TEMP/reason.txt" ] || reason=$(cat "$RUNNER_TEMP/reason.txt")
          case "$reason" in
              *[!A-Za-z0-9\ _-]*) reason= ;;
          esac
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
