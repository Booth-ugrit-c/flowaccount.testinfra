name: tpl-workspace-unit

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number, digits or empty
        required: false
        default: ""
        type: string
      pr_branch:
        description: Branch that holds the change
        required: true
        type: string
      pr_author:
        description: Login of the pull request author, or empty
        required: false
        default: ""
        type: string
      pr_sha:
        description: Commit to test, a full SHA resolved by the caller
        required: true
        type: string
      base_sha:
        description: Base commit for the affected selection, a full SHA resolved by the caller
        required: true
        type: string
      default_tip:
        description: True only when the caller resolved pr_sha to the default branch tip on a dispatch from the default branch
        required: false
        default: false
        type: boolean
      lanes:
        description: Comma-separated lanes the caller runs; empty means every lane
        required: false
        default: ""
        type: string
      runner_label:
        description: Opaque runner label; it is printed unmasked in public logs, so never a host name
        required: false
        default: ""
        type: string
      cache:
        description: use or off
        required: false
        default: "use"
        type: string
      retest:
        description: True when this run retests an earlier one
        required: false
        default: false
        type: boolean
      sim_fault:
        description: Lab fault to inject, empty outside the lab
        required: false
        default: ""
        type: string
      workspace_root:
        description: Directory that holds the Nx workspace, its lockfile and .nvmrc
        required: false
        default: sim/workspace
        type: string
    outputs:
      verdict:
        description: pass, test or infra
        value: ${{ jobs.classify.outputs.verdict }}
      reason:
        description: Named cause of an infra verdict, otherwise empty
        value: ${{ jobs.classify.outputs.reason }}
      executed:
        description: Tests the lane executed, summed over its projects; empty when the guard did not pass
        value: ${{ jobs.run.outputs.executed }}

permissions:
  contents: read

jobs:
  route:
    name: route
    uses: ./.github/workflows/tpl-route.yml # zizmor: ignore[self-repository]
    with:
      runner_label: ${{ inputs.retest != true && inputs.runner_label || '' }}

  run:
    name: run workspace-unit
    needs: route
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.route.outputs.target == 'onprem' && inputs.runner_label || 'ubuntu-24.04' }}
    timeout-minutes: 25
    environment: ${{ needs.route.outputs.target == 'onprem' && inputs.runner_label != '' && 'sim-cache-lab' || 'sim-cache-read' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIM_ROOT: ${{ inputs.workspace_root }}
      NPM_CONFIG_USERCONFIG: /dev/null/user.npmrc
      NPM_CONFIG_GLOBALCONFIG: /dev/null/global.npmrc
    outputs:
      executed: ${{ steps.zero.outputs.executed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Checkout trusted
        if: ${{ runner.environment == 'self-hosted' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .sim-trusted
          persist-credentials: false
          sparse-checkout: core
      - name: Hygiene
        if: ${{ runner.environment == 'self-hosted' }}
        env:
          SIM_SURVIVORS: node
        run: |
          set -u
          status=0
          if [ -L .sim-trusted ] || [ ! -d .sim-trusted/.git ] || [ "$(git -C .sim-trusted rev-parse HEAD)" != "$GITHUB_SHA" ]; then
              echo "::error::the trusted checkout is not the dispatch commit"
              status=1
          else
              sh .sim-trusted/core/prejob.sh || status=$?
          fi
          rm -rf .sim-trusted
          exit "$status"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.workspace_root }}/.nvmrc
          package-manager-cache: "false"
      - name: Health
        env:
          FAIL_HEALTH: ${{ inputs.sim_fault == 'fail_health_twice' || inputs.sim_fault == 'fail_health_once' && inputs.retest != true }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/markers"
          echo "MARKERS=$RUNNER_TEMP/markers" >> "$GITHUB_ENV"
          if [ "$FAIL_HEALTH" = true ]; then
              echo "::error::injected health failure"
              exit 1
          fi
          python3 --version
          node --version
          npm --version
          touch "$RUNNER_TEMP/markers/health"
      - name: Join the tailnet
        id: join
        if: ${{ runner.environment == 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.SIM_TAILNET_CLIENT_ID }}
          audience: ${{ secrets.SIM_TAILNET_AUDIENCE }}
          tags: tag:ci-sim
          args: --accept-routes=false
          use-cache: "false"
      - name: Cache tripwire
        env:
          SIM_TAILNET_JOIN: ${{ steps.join.outcome }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_READ_KEY_ID: ${{ secrets.SIM_CACHE_READ_KEY_ID }}
          SIM_CACHE_READ_SECRET: ${{ secrets.SIM_CACHE_READ_SECRET }}
        run: sh adapters/workspace/cache_npm.sh tripwire "$MARKERS"
      - name: Restore cache
        env:
          SIM_CACHE_MODE: ${{ inputs.cache }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_READ_KEY_ID: ${{ secrets.SIM_CACHE_READ_KEY_ID }}
          SIM_CACHE_READ_SECRET: ${{ secrets.SIM_CACHE_READ_SECRET }}
        run: sh adapters/workspace/cache_npm.sh restore "$RUNNER_TEMP/npm-cache"
      - name: Install
        run: |
          set -eu
          cd "$SIM_ROOT"
          npm ci --cache "$RUNNER_TEMP/npm-cache" --prefer-offline --ignore-scripts --no-audit --no-fund
      - name: Affected
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.pr_sha }}
        run: python3 -m adapters.workspace.affected --base "$BASE_SHA" --head "$HEAD_SHA" --root "$SIM_ROOT" > "$RUNNER_TEMP/affected.json"
      - name: Plan
        env:
          FULL: ${{ inputs.default_tip && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.sim_fault == '' && runner.environment == 'github-hosted' && '1' || '0' }}
        run: |
          set -eu
          set --
          if [ "$FULL" = 1 ]; then
              set -- --all
          fi
          python3 -m adapters.workspace.plan --affected "$RUNNER_TEMP/affected.json" "$@" --lane unit --emit test --names > "$RUNNER_TEMP/unit.txt"
          python3 -m adapters.workspace.plan --affected "$RUNNER_TEMP/affected.json" "$@" --lane unit --emit test > "$RUNNER_TEMP/unit-roots.txt"
      - name: Test
        env:
          PARALLEL: "0"
          KILL_RUNNER: ${{ inputs.sim_fault == 'kill_both' || inputs.sim_fault == 'kill_onprem' && needs.route.outputs.target == 'onprem' }}
          FAIL_TEST: ${{ inputs.sim_fault == 'fail_test' && '1' || '0' }}
        run: |
          set -u
          touch "$MARKERS/test-start"
          if [ "$KILL_RUNNER" = true ]; then
              sh "$GITHUB_WORKSPACE/core/kill_own_runner.sh" || exit 1
              sleep 600
          fi
          if [ "$FAIL_TEST" = 1 ]; then
              project=$(head -n 1 "$RUNNER_TEMP/unit-roots.txt")
              [ -z "$project" ] || printf '%s\n' 'test("asserts the wrong value", () => expect(1).toBe(2));' > "$GITHUB_WORKSPACE/$project/forced-failure.test.js"
          fi
          status=0
          sh adapters/workspace/test_lane.sh "$RUNNER_TEMP/unit.txt" "$RUNNER_TEMP/counts" "$PARALLEL" || status=1
          touch "$MARKERS/test-end"
          exit "$status"
      - name: Zero tests
        id: zero
        run: |
          set -u
          status=0
          python3 -m core.zero_tests --list "$RUNNER_TEMP/unit.txt" --counts "$RUNNER_TEMP/counts" > "$RUNNER_TEMP/zero.txt" || status=1
          cat "$RUNNER_TEMP/zero.txt"
          [ "$status" = 0 ] || exit 1
          awk '/^executed=[0-9]+ / { sub(/^executed=/, ""); n += $1 } END { printf "executed=%d\n", n }' "$RUNNER_TEMP/zero.txt" >> "$GITHUB_OUTPUT"
      - name: Upload markers
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markers-workspace-unit
          path: ${{ runner.temp }}/markers
          if-no-files-found: ignore
          retention-days: 1

  save:
    name: save workspace-unit
    if: ${{ inputs.default_tip && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.sim_fault == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sim-cache-write
    permissions:
      contents: read
      id-token: write
    env:
      SIM_ROOT: ${{ inputs.workspace_root }}
      NPM_CONFIG_USERCONFIG: /dev/null/user.npmrc
      NPM_CONFIG_GLOBALCONFIG: /dev/null/global.npmrc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.workspace_root }}/.nvmrc
          package-manager-cache: "false"
      - name: Join the tailnet
        id: join
        if: ${{ runner.environment == 'github-hosted' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.SIM_TAILNET_CLIENT_ID }}
          audience: ${{ secrets.SIM_TAILNET_AUDIENCE }}
          tags: tag:ci-sim
          args: --accept-routes=false
          use-cache: "false"
      - name: Cache tripwire
        env:
          MARKERS: ${{ runner.temp }}/markers
          SIM_TAILNET_JOIN: ${{ steps.join.outcome }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_READ_KEY_ID: ${{ secrets.SIM_CACHE_READ_KEY_ID }}
          SIM_CACHE_READ_SECRET: ${{ secrets.SIM_CACHE_READ_SECRET }}
        run: sh adapters/workspace/cache_npm.sh tripwire "$MARKERS"
      - name: Install
        run: |
          set -eu
          cd "$SIM_ROOT"
          npm ci --cache "$RUNNER_TEMP/npm-cache" --prefer-offline --ignore-scripts --no-audit --no-fund
      - name: Save cache
        if: ${{ inputs.default_tip && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.sim_fault == '' && runner.environment == 'github-hosted' }}
        env:
          MARKERS: ${{ runner.temp }}/markers
          SIM_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SIM_CACHE_MODE: ${{ inputs.cache }}
          SIM_CACHE_ENDPOINT_LAB: ${{ secrets.SIM_CACHE_ENDPOINT_LAB }}
          SIM_CACHE_ENDPOINT_TAILNET: ${{ secrets.SIM_CACHE_ENDPOINT_TAILNET }}
          SIM_CACHE_WRITE_KEY_ID: ${{ secrets.SIM_CACHE_WRITE_KEY_ID }}
          SIM_CACHE_WRITE_SECRET: ${{ secrets.SIM_CACHE_WRITE_SECRET }}
        run: sh adapters/workspace/cache_npm.sh save "$RUNNER_TEMP/npm-cache"

  classify:
    name: classify workspace-unit
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      reason: ${{ steps.verdict.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Classify
        id: verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          set -eu
          verdict=$(python3 -m core.classify --job-dir "$RUNNER_TEMP/job" --fetch-job "run workspace-unit" --fetch-artifact markers-workspace-unit --run-result "$RUN_RESULT" --reason-file "$RUNNER_TEMP/reason.txt" --infra-step "Set up Node" --done-marker test-end)
          case "$verdict" in
              pass | test | infra) ;;
              *) verdict="test" ;;
          esac
          reason=
          [ ! -f "$RUNNER_TEMP/reason.txt" ] || reason=$(cat "$RUNNER_TEMP/reason.txt")
          case "$reason" in
              *[!A-Za-z0-9\ _-]*) reason= ;;
          esac
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
