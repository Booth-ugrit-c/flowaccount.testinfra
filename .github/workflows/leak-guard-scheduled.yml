name: leak-guard-scheduled

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leak-guard-scheduled
  cancel-in-progress: false

jobs:
  scan-all:
    name: scan-all
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch every branch, tag and pull request ref
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*:refs/remotes/pull/*'
      - name: Scan every object reachable from every ref
        env:
          LEAK_GUARD_DENYLIST: ${{ secrets.LEAK_GUARD_DENYLIST }}
        run: python -m tools.leak_guard scan-all --require-denylist
