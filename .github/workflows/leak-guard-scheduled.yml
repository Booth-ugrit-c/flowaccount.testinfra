name: leak-guard-scheduled

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leak-guard-scheduled
  cancel-in-progress: false

jobs:
  scan-all:
    name: scan-all
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch every branch, tag and pull request ref
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*:refs/remotes/pull/*'
      - name: Scan branches and tags with the deny-list
        env:
          LEAK_GUARD_DENYLIST: ${{ secrets.LEAK_GUARD_DENYLIST }}
        run: python -m tools.leak_guard scan-all --refs refs/remotes/origin/ --refs refs/tags/ --require-denylist
      - name: Scan pull request refs with generic rules only
        if: ${{ !cancelled() }}
        # Fork content is attacker-controlled: with the deny-list its findings would confirm guesses.
        run: |
          rc=0
          env -u LEAK_GUARD_DENYLIST -u LEAK_GUARD_DENYLIST_FILE python -m tools.leak_guard scan-all --refs refs/remotes/pull/ >"$RUNNER_TEMP/pull-scan.txt" 2>&1 || rc=$?
          sed 's/^/    /' "$RUNNER_TEMP/pull-scan.txt"
          case "$rc" in
            0) ;;
            1) echo "::warning::pull request refs hold generic-rule findings, see this step's log" ;;
            *) echo "::warning::pull request scan did not run (exit $rc), see this step's log" ;;
          esac
          exit 0
