minRunners: 0
maxRunners: 4
template:
  spec:
    containers:
      - name: runner
        image: __RUNNER_IMAGE__
        imagePullPolicy: Never
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests:
            cpu: 1500m
            memory: 2560Mi
          limits:
            memory: 3Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
      - name: dind
        image: __DIND_IMAGE__
        imagePullPolicy: IfNotPresent
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --registry-mirror=http://$(HOST_IP):5000
          - --insecure-registry=$(HOST_IP):5000
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
          - name: HOST_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
